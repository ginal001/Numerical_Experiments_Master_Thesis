[project]
name = "stochinter"
version = "0.1.0"
description = "Numerical experiments for master thesis realised on University of Warsaw"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "ipykernel>=7.1.0",
    "torch",
    "torchvision",
    "torchaudio",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "debugpy>=1.8.20",
    "ipython<9",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["I"]